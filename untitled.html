<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="untitled — Photography">
  <title>untitled · dandellas</title>
  <link rel="icon" href="./assets/seed.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./fonts.css"><link rel="stylesheet" href="./nav-effects.css"><script src="./nav-effects.js" defer></script>
  <link rel="stylesheet" href="./untitled.css">
  <script src="./photo-portfolio.js" defer></script>
  <script src="./untitled.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#gallery">사진 목록으로 바로가기</a>
  <header class="site-header">
    <a href="./untitled.html" class="site-name" id="site-name">untitled</a>
    <div class="header-center" id="header-center"><button type="button" class="header-title" data-gallery aria-label="Photography, 사진 목록으로 이동">Photography</button><button type="button" class="gallery-plus" id="header-index" data-index aria-label="사진 인덱스 열기">+</button></div>
    <nav class="desktop-nav" id="desktop-nav" aria-label="주 메뉴"><a href="./index.html">home</a><a href="./input.html">seeding</a><a href="./dandelion.html">dandelion</a></nav>
    <button type="button" class="menu-toggle" id="menu-toggle" aria-haspopup="dialog" aria-controls="mobile-menu">Menu</button>
    <button type="button" class="return-link" id="return-link" hidden>↩ Return</button>
  </header>

  <main>
    <div id="overview-view" class="page-view">
      <h1 class="sr-only">Photography</h1>
      <section class="photo-hero" aria-label="Photography">
        <div id="hero-images" class="hero-images"></div>
        <div class="hero-controls" id="hero-controls" hidden><button type="button" id="hero-previous" aria-label="이전 사진">←</button><button type="button" id="hero-pause" aria-label="사진 슬라이드 일시정지">Pause</button><span id="hero-counter"></span><button type="button" id="hero-next" aria-label="다음 사진">→</button></div>
      </section>
      <section class="gallery" id="gallery" aria-label="사진 목록" tabindex="-1"><div class="portfolio-grid" id="portfolio-grid"></div></section>
    </div>

    <section id="project-view" class="page-view project-view" aria-labelledby="project-number" hidden>
      <div class="project-meta"><h1 id="project-number" tabindex="-1"></h1><span id="project-counter" aria-label="현재 사진"></span></div>
      <div class="zoom-controls" role="group" aria-label="사진 확대"><button type="button" data-zoom="-1" aria-label="축소">−</button><button type="button" data-zoom="0" id="zoom-level" aria-label="화면에 맞추기">100%</button><button type="button" data-zoom="1" aria-label="확대">+</button></div>
      <div class="project-photos" id="project-photos"></div>
      <nav class="project-thumbnails" id="project-thumbnails" aria-label="이 묶음의 사진"></nav>
    </section>

    <section id="index-view" class="page-view index-view" aria-label="사진 인덱스" hidden>
      <div class="index-hover-background" id="index-hover-background" aria-hidden="true"><img id="index-hover-image" alt=""></div>
      <div class="index-switch" role="group" aria-label="인덱스 보기 방식"><button type="button" data-index-mode="overview" aria-pressed="false">Overview</button><span aria-hidden="true">/</span><button type="button" data-index-mode="list" aria-pressed="true">List</button></div>
      <div class="index-list" id="index-list"></div>
      <div class="index-overview portfolio-grid" id="index-overview" hidden></div>
    </section>
    <p class="empty-state" id="empty-state" hidden>사진을 불러오지 못했어요. <a href="./index.html">home</a></p>
    <noscript><p class="empty-state">사진을 보려면 브라우저에서 JavaScript를 허용해 주세요. <a href="./index.html">home</a></p></noscript>
  </main>

  <dialog class="mobile-menu" id="mobile-menu" aria-label="메뉴">
    <div class="mobile-menu-top"><a href="./untitled.html">untitled</a><button type="button" id="menu-close" aria-label="메뉴 닫기">Close</button></div>
    <nav aria-label="모바일 주 메뉴"><a href="./index.html">home</a><a href="./input.html">seeding</a><a href="./dandelion.html">dandelion</a></nav>
  </dialog>
  <p class="sr-only" id="view-announcement" role="status" aria-live="polite"></p>
</body>
</html>
